# Regenerates docs/star-history.svg from the GitHub stargazers API.
#
# The third-party star-history.com badge broke for every reader once GitHub
# started requiring authentication on the stargazers endpoint, so the chart is
# generated here with the repo's own token and committed to the repo.
#
# Note: GitHub disables scheduled workflows in repositories with no activity for
# 60 days. This repo is actively maintained, but if the schedule ever goes quiet,
# re-enable it from the Actions tab or trigger it manually below.

name: Star history

on:
  schedule:
    # 03:17 UTC on the 1st and the 15th, i.e. roughly every two weeks.
    #
    # Two deliberate choices:
    #   - Not "*/14": day-of-month step values restart every month, so the
    #     real interval would drift.
    #   - Not the top of the hour: GitHub queues scheduled runs, and :00 is
    #     the most congested minute, which means longer delays and, under
    #     heavy load, dropped runs. An odd minute avoids the crowd.
    - cron: "17 3 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # the failure step below opens/updates a tracking issue

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Generate chart
        env:
          # The default GITHUB_TOKEN cannot read this endpoint: it answers
          # 403 "You do not have permission to view the stargazers of this
          # repository". STAR_HISTORY_TOKEN is a personal access token, either
          # fine-grained with Metadata: Read-only, or classic with public_repo.
          GITHUB_TOKEN: ${{ secrets.STAR_HISTORY_TOKEN }}
        run: python3 scripts/gen-star-history.py --repo "${{ github.repository }}"

      - name: Commit if the chart changed
        run: |
          if [ -z "$(git status --porcelain docs/star-history.svg docs/star-history.json)" ]; then
            echo "Star history unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/star-history.svg docs/star-history.json
          git commit -m "Updated star history chart"
          git push

      # Two layers of failure signalling cover two different failure modes.
      # This step handles "the run happened but failed" (e.g. an expired
      # token). The generation date stamped on the chart handles the other
      # mode - "the run never happened", which produces no run to fail and so
      # cannot be caught here. GitHub's built-in email on failed workflows is
      # the third, per-account layer, configured outside this repo.
      #
      # Deduplicated: a repeatedly failing schedule appends to one open issue
      # instead of opening a new one every fortnight. Uses the default
      # GITHUB_TOKEN (issues: write above), never the stargazers PAT.
      - name: Open or update a failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label="star-history-failure"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label "$label" --state open --limit 1 --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Star history workflow failed again on $(date -u +%Y-%m-%d). Run: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$label" \
              --title "Star history workflow is failing" \
              --body "$(printf 'The scheduled star-history workflow failed.\n\nFailed run: %s\n\nLikely causes, most common first:\n- The STAR_HISTORY_TOKEN secret has expired (fine-grained tokens last at most 366 days).\n- GitHub disabled the schedule after 60 days of repo inactivity; re-enable it from the Actions tab.\n- The GitHub stargazers API returned an error.\n\nClose this issue once the workflow succeeds again; it will reopen a fresh one if it breaks later.' "$RUN_URL")"
          fi
